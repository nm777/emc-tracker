<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Saver — Humidity Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: #94a3b8;
    font-size: 0.875rem;
    margin-bottom: 1.5rem;
  }
  .controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  select {
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 1rem;
    min-width: 250px;
  }
  .stats {
    display: flex;
    gap: 2rem;
    font-size: 0.875rem;
    color: #94a3b8;
  }
  .stats span strong {
    color: #e2e8f0;
  }
  .chart-wrap {
    background: #1e293b;
    border-radius: 0.75rem;
    border: 1px solid #334155;
    padding: 1rem;
    height: calc(100vh - 12rem);
    min-height: 400px;
    position: relative;
  }
  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #64748b;
    font-size: 1.125rem;
  }
</style>
</head>
<body>
  <h1>Humidity Tracker</h1>
  <p class="subtitle">Construction project environmental monitoring — daily summaries</p>
  <div class="controls">
    <select id="projectSelect">
      <option value="">— Select a project —</option>
    </select>
    <div class="stats" id="stats"></div>
  </div>
  <div class="chart-wrap">
    <div class="no-data" id="noData">Run <code>node index.js</code> to collect data, then refresh this page.</div>
    <canvas id="chart" style="display:none"></canvas>
  </div>

<script src="data.js"></script>
<script>
const select = document.getElementById("projectSelect");
const statsEl = document.getElementById("stats");
const noData = document.getElementById("noData");
const canvas = document.getElementById("chart");
let chart = null;

if (typeof HUMIDITY_DATA === "undefined" || Object.keys(HUMIDITY_DATA).length === 0) {
  noData.style.display = "flex";
} else {
  noData.style.display = "none";
  canvas.style.display = "block";

  for (const project of Object.keys(HUMIDITY_DATA)) {
    const opt = document.createElement("option");
    opt.value = project;
    opt.textContent = `${project} — ${HUMIDITY_DATA[project].city}`;
    select.appendChild(opt);
  }

  select.addEventListener("change", () => {
    if (chart) chart.destroy();
    statsEl.innerHTML = "";
    if (!select.value) return;
    render(select.value);
  });

  if (Object.keys(HUMIDITY_DATA).length === 1) {
    select.value = Object.keys(HUMIDITY_DATA)[0];
    render(select.value);
  }
}

function render(project) {
  const { city, days } = HUMIDITY_DATA[project];
  const labels = days.map(d => d.date);

  const allMin = Math.min(...days.map(d => d.min));
  const allMax = Math.max(...days.map(d => d.max));
  const allAvg = (days.reduce((s, d) => s + d.avg, 0) / days.length).toFixed(1);
  const maxDailySwing = Math.max(...days.map(d => d.max - d.min));

  statsEl.innerHTML =
    `<span>Days: <strong>${days.length}</strong></span>` +
    `<span>Overall Min: <strong>${allMin}%</strong></span>` +
    `<span>Overall Max: <strong>${allMax}%</strong></span>` +
    `<span>Overall Avg: <strong>${allAvg}%</strong></span>` +
    `<span>Worst daily swing: <strong>${maxDailySwing}%</strong></span>`;

  chart = new Chart(canvas, {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: "Max",
          data: days.map(d => d.max),
          borderColor: "#f87171",
          backgroundColor: "rgba(248,113,113,0.08)",
          fill: "+1",
          pointRadius: days.length > 90 ? 0 : 2,
          borderWidth: 2,
          tension: 0.2,
        },
        {
          label: "Avg",
          data: days.map(d => d.avg),
          borderColor: "#3b82f6",
          backgroundColor: "rgba(59,130,246,0.08)",
          fill: false,
          pointRadius: days.length > 90 ? 0 : 2,
          borderWidth: 2,
          tension: 0.2,
        },
        {
          label: "Min",
          data: days.map(d => d.min),
          borderColor: "#34d399",
          backgroundColor: "rgba(52,211,153,0.08)",
          fill: "-1",
          pointRadius: days.length > 90 ? 0 : 2,
          borderWidth: 2,
          tension: 0.2,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: "#e2e8f0" } },
        tooltip: {
          backgroundColor: "#1e293b",
          borderColor: "#334155",
          borderWidth: 1,
          titleColor: "#e2e8f0",
          bodyColor: "#94a3b8",
          callbacks: {
            title: (items) => items[0].label,
            label: (item) => `  ${item.dataset.label}: ${item.raw}%`
          }
        }
      },
      scales: {
        x: {
          type: "time",
          time: { unit: "day", tooltipFormat: "MMM d, yyyy" },
          ticks: { color: "#64748b", maxTicksLimit: 15 },
          grid: { color: "#1e293b" }
        },
        y: {
          min: 0,
          max: 100,
          ticks: { color: "#64748b", callback: (v) => v + "%" },
          grid: { color: "#334155" },
          title: { display: true, text: "Relative Humidity (%)", color: "#94a3b8" }
        }
      }
    }
  });
}
</script>
</body>
</html>
